serenity {
  project.name = "Serenity Screenplay - DemoBlaze"
  take.screenshots = FOR_FAILURES
  console.colors = true
}

webdriver {
  driver   = "chrome"
  base.url = "https://www.demoblaze.com/"

  timeouts {
    implicitlywait = 0
  }
  wait.for.timeout = 8000
}
chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors; --window-size=1920,1080;"""
headless.mode = "false"